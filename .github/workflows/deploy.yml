name: Deploy rollplay-scion

on:
  push:
    branches:
      - main  # or whatever your branch is called

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: 18.227.221.129
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/rollplay-scion
            git pull origin main
            pip3 install -r requirements.txt
            sudo systemctl restart rollplay-scion
